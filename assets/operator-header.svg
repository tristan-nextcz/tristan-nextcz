<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="280"
  viewBox="0 0 1200 280"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Operator with receipts</title>
  <desc id="description">
    A systems diagram connecting evidence, decisions, delivery, and handoff.
  </desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#17132b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#background)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="23" fill="none" stroke="#ffffff" stroke-opacity=".12"/>

  <g fill="none" stroke="url(#signal)" stroke-width="2" stroke-opacity=".75">
    <path d="M60 72H186L244 130H346" />
    <path d="M60 206H180L252 144H346" />
    <path d="M854 139H942L1000 82H1140" />
    <path d="M854 139H942L1000 205H1140" />
  </g>

  <g filter="url(#glow)">
    <circle cx="60" cy="72" r="6" fill="#67e8f9"/>
    <circle cx="60" cy="206" r="6" fill="#67e8f9"/>
    <circle cx="346" cy="139" r="7" fill="#3fb950"/>
    <circle cx="854" cy="139" r="7" fill="#3fb950"/>
    <circle cx="1140" cy="82" r="6" fill="#a371f7"/>
    <circle cx="1140" cy="205" r="6" fill="#a371f7"/>
  </g>

  <g
    fill="#9da7b3"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="12"
    font-weight="600"
    letter-spacing="2"
  >
    <text x="82" y="77" text-anchor="start">OBSERVED STATE</text>
    <text x="82" y="211" text-anchor="start">CONSTRAINTS</text>
    <text x="1120" y="87" text-anchor="end">PROOF</text>
    <text x="1120" y="210" text-anchor="end">HANDOFF</text>
  </g>

  <g
    fill="#f0f6fc"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
  >
    <text x="600" y="121" font-size="38" font-weight="760" letter-spacing="1" text-anchor="middle">
      OPERATOR WITH RECEIPTS
    </text>
    <text x="600" y="157" fill="#b7c0ca" font-size="16" font-weight="500" letter-spacing="1.2" text-anchor="middle">
      SYSTEMS · EVIDENCE · DELIVERY · CONTROL
    </text>
  </g>

  <g
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="11"
    font-weight="700"
    letter-spacing="1.4"
  >
    <rect x="434" y="191" width="92" height="28" rx="14" fill="#67e8f9" fill-opacity=".11" stroke="#67e8f9" stroke-opacity=".5"/>
    <text x="480" y="209" fill="#a5f3fc" text-anchor="middle">AI SYSTEMS</text>
    <rect x="540" y="191" width="120" height="28" rx="14" fill="#3fb950" fill-opacity=".11" stroke="#3fb950" stroke-opacity=".5"/>
    <text x="600" y="209" fill="#7ee787" text-anchor="middle">PLATFORMS</text>
    <rect x="674" y="191" width="92" height="28" rx="14" fill="#a371f7" fill-opacity=".11" stroke="#a371f7" stroke-opacity=".5"/>
    <text x="720" y="209" fill="#d2a8ff" text-anchor="middle">CONTROLS</text>
  </g>
</svg>
